[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "img-vlm-extractor"
version = "0.1.0"
description = "이미지에서 구조화된 값을 뽑고, 자동처리해도 되는지 판정하는 엔진"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings",
    "httpx",             # Groq (OpenAI 호환 REST)
    "pillow",
    "pytesseract",       # OCR — 시스템에 tesseract + kor 언어 데이터가 있어야 한다
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# 실험용 — 노트북·데이터셋
lab = ["jupyter", "nbconvert", "ipykernel", "datasets", "pandas", "numpy", "matplotlib"]

[project.scripts]
img-vlm = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
