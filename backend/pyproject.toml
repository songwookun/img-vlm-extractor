[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "img-vlm-extractor"
version = "0.1.0"
description = "이미지에서 구조화된 값을 뽑고, 자동처리해도 되는지 판정하는 엔진"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "google-genai",      # 모델 A — 상용 폐쇄 (스키마 강제 지원)
    "httpx",             # 모델 B — Groq (OpenAI 호환 REST)
    "pillow",            # 이미지 로드·리사이즈
    "python-multipart",  # 파일 업로드
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]
# 실험용 — 노트북·데이터셋. 서빙에는 필요 없다
lab = ["jupyter", "nbconvert", "ipykernel", "datasets", "pandas", "numpy", "matplotlib", "pytesseract"]
# 로컬 오픈소스 VLM (2층). 기본 경로에 두지 않는다 — md-rag-chatbot 에서 겪은 함정
local = ["mlx-vlm"]

[tool.setuptools.packages.find]
include = ["app*"]
